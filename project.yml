name: ExpenseTracking
options:
  bundleIdPrefix: com.collinbrowse.expensetracking
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  CashFlowKit:
    path: Packages/CashFlowKit
  CashFlowData:
    path: Packages/CashFlowData
targets:
  ExpenseTracking:
    type: application
    platform: iOS
    sources:
      - path: ExpenseTracking
      - path: Shared/LiveActivities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.collinbrowse.expensetracking.app
        INFOPLIST_FILE: ExpenseTracking/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        CODE_SIGN_ENTITLEMENTS: ExpenseTracking/Resources/ExpenseTracking.entitlements
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: CashFlowKit
      - package: CashFlowData
      - target: ExpenseTrackingWidget
        embed: true
  ExpenseTrackingWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ExpenseTrackingWidget
        excludes:
          - Info.plist
      - path: Shared/LiveActivities
    info:
      path: ExpenseTrackingWidget/Info.plist
      properties:
        CFBundleDisplayName: Cash Flow
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.collinbrowse.expensetracking.app.widget
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        CODE_SIGN_ENTITLEMENTS: ExpenseTrackingWidget/ExpenseTrackingWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - package: CashFlowKit
      - package: CashFlowData
  ExpenseTrackingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ExpenseTrackingTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.collinbrowse.expensetracking.app.tests
    dependencies:
      - target: ExpenseTracking
      - package: CashFlowKit
      - package: CashFlowData
  ExpenseTrackingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ExpenseTrackingUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.collinbrowse.expensetracking.app.uitests
    dependencies:
      - target: ExpenseTracking
schemes:
  ExpenseTracking:
    build:
      targets:
        ExpenseTracking: all
        ExpenseTrackingWidget: all
        ExpenseTrackingTests: [test]
        ExpenseTrackingUITests: [test]
    test:
      targets:
        - ExpenseTrackingTests
        - ExpenseTrackingUITests
